# Apache config for Web Slideshow at /web-present
# Add to spark.wiemax.net VirtualHost configuration
#
# All paths are configurable via variables — edit the two values below,
# then drop the rest into your VirtualHost for spark.wiemax.net.

Define WEBPRESENT_URL   /web-present
Define WEBPRESENT_PATH  /usr/src/web-present/client

# Ensure this location is NOT proxied to another backend
ProxyPass ${WEBPRESENT_URL} !

# Serve index.html when the bare path is requested
DirectoryIndex index.html

# Alias the virtual path to the filesystem path
Alias ${WEBPRESENT_URL} ${WEBPRESENT_PATH}

# Grant Apache filesystem access to the content directory
<Directory ${WEBPRESENT_PATH}>
    Options -Indexes -ExecCGI +FollowSymLinks
    Require all granted
</Directory>

# URL-level configuration: MIME types and security headers
<Location ${WEBPRESENT_URL}>
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "SAMEORIGIN"

    AddType text/markdown    .md
    AddType text/markdown    .mkd
    AddType text/markdown    .markdown
    AddType text/plain       .txt
    AddType image/svg+xml    .svg
    AddType image/png        .png
    AddType image/jpeg       .jpg
    AddType image/jpeg       .jpeg
    AddType image/webp       .webp
    AddType image/gif        .gif
    AddType image/ico        .ico
</Location>

# Cleanup — undefine variables so they don't leak into the parent config
Undefine WEBPRESENT_PATH
Undefine WEBPRESENT_URL
